name: test
on: workflow_call
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  test:
    name: Unit tests with race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=coverage.out -json ./... | tee test.json
      - name: Summary
        if: always()
        run: |
          {
            echo "## 🧪 Tests"
            if [ -f test.json ]; then python3 scripts/summarize_tests.py test.json coverage.out; else echo "No test report was produced."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
